<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img" aria-label="Illustration d'une baguette souriante avec une note de 4,5 étoiles, un badge fait maison et un badge service colis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D8B6"/>
      <stop offset="1" stop-color="#FBF3E6"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFC078"/>
      <stop offset="1" stop-color="#C98A3C"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4A2C17" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- background blob -->
  <path d="M320 44 C 528 44 596 148 596 310 C 596 472 486 576 320 576 C 154 576 44 472 44 310 C 44 148 112 44 320 44 Z" fill="url(#bg)"/>
  <circle cx="320" cy="302" r="212" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="3 14"/>

  <!-- floating dots -->
  <circle cx="122" cy="150" r="9" fill="#C0502F" opacity="0.18"/>
  <circle cx="530" cy="182" r="6" fill="#C0502F" opacity="0.3"/>
  <circle cx="96" cy="360" r="5" fill="#C9832F" opacity="0.4"/>
  <circle cx="548" cy="360" r="8" fill="#F2D8C6"/>
  <circle cx="152" cy="492" r="6" fill="#C0502F" opacity="0.2"/>
  <circle cx="514" cy="500" r="5" fill="#E0A458" opacity="0.55"/>

  <!-- sparkles -->
  <g fill="#C9832F">
    <path d="M140 234 l2.2 4.9 4.9 2.2 -4.9 2.2 -2.2 4.9 -2.2 -4.9 -4.9 -2.2 4.9 -2.2 Z"/>
    <path d="M516 240 l2.6 5.7 5.7 2.6 -5.7 2.6 -2.6 5.7 -2.6 -5.7 -5.7 -2.6 5.7 -2.6 Z"/>
  </g>
  <g fill="#C0502F">
    <path d="M486 118 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 Z"/>
    <path d="M160 422 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 Z"/>
  </g>

  <!-- wheat stalk accent (left) -->
  <g transform="translate(112 268) rotate(-22)">
    <path d="M12 34V8" fill="none" stroke="#C9832F" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 26C5 26 2 22.5 2 18s3-6 10-6 10 4.5 10 8-3 6-10 6z" fill="none" stroke="#C9832F" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M12 36C5 36 2 32.5 2 28s3-6 10-6 10 4.5 10 8-3 6-10 6z" fill="none" stroke="#C9832F" stroke-width="2.6" stroke-linejoin="round"/>
  </g>

  <!-- main baguette character -->
  <g filter="url(#drop)">
    <g transform="translate(320 316)">
      <path d="M-118 6 C-118 -58 -66 -96 0 -96 C 66 -96 118 -58 118 6 C 118 48 106 82 100 96 C 40 124 -40 124 -100 96 C -106 82 -118 48 -118 6 Z"
            fill="url(#bag)" stroke="#A96A2A" stroke-width="3" stroke-linejoin="round"/>
      <!-- score marks -->
      <path d="M-78 -34 l26 14 M-34 -46 l26 14 M10 -46 l26 14 M54 -34 l26 14" fill="none" stroke="#B97A30" stroke-width="6" stroke-linecap="round"/>
      <!-- baker's cap -->
      <g>
        <path d="M-64 -84 C-68 -112 -36 -126 -6 -126 C 24 -126 58 -112 52 -84 L-64 -84 Z" fill="#FFF7EC" stroke="#E3CFB4" stroke-width="3"/>
        <rect x="-70" y="-84" width="128" height="16" rx="8" fill="#FFF7EC" stroke="#E3CFB4" stroke-width="3"/>
      </g>
      <!-- face -->
      <circle cx="-40" cy="14" r="6.5" fill="#4A2C17"/>
      <circle cx="40" cy="14" r="6.5" fill="#4A2C17"/>
      <path d="M-34 40 Q0 66 34 40" fill="none" stroke="#4A2C17" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-62" cy="30" r="11" fill="#E8A27C" opacity="0.5"/>
      <circle cx="62" cy="30" r="11" fill="#E8A27C" opacity="0.5"/>
    </g>
  </g>

  <!-- rating card -->
  <g filter="url(#drop)">
    <rect x="48" y="400" width="222" height="92" rx="20" fill="#FFFFFF"/>
    <g transform="translate(72 424)">
      <g fill="#E0A458">
        <path d="M6 0l1.6 3.3 3.6.5-2.6 2.5.6 3.6L6 8.5 2.9 9.9l.6-3.6L1 3.8l3.6-.5L6 0z"/>
        <path d="M20 0l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.6-3.1 1.6.6-3.6-2.6-2.5 3.6-.5L20 0z"/>
        <path d="M34 0l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.6-3.1 1.6.6-3.6-2.6-2.5 3.6-.5L34 0z"/>
        <path d="M48 0l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.6-3.1 1.6.6-3.6-2.6-2.5 3.6-.5L48 0z"/>
        <path d="M62 0l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.6-3.1 1.6.6-3.6-2.6-2.5 3.6-.5L62 0z"/>
      </g>
      <text x="0" y="26" font-family="Fraunces, serif" font-weight="700" font-size="20" fill="#2B1D12">4,5 / 5</text>
      <text x="0" y="44" font-family="Inter, sans-serif" font-size="12.5" fill="#7A6A55">127 avis Google · boulangerie</text>
    </g>
  </g>

  <!-- fait maison pill -->
  <g filter="url(#drop)">
    <rect x="392" y="84" width="204" height="56" rx="28" fill="#FFFFFF"/>
    <circle cx="420" cy="112" r="18" fill="#C0502F"/>
    <path d="M414 112l4.5 4.5 8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="446" y="117" font-family="Fraunces, serif" font-weight="600" font-size="15" fill="#2B1D12">Fait maison</text>
  </g>

  <!-- service colis pill -->
  <g filter="url(#drop)">
    <rect x="392" y="448" width="208" height="56" rx="28" fill="#FFFFFF"/>
    <circle cx="420" cy="476" r="18" fill="#E0A458"/>
    <path d="M420 466l8 4.2v8.4l-8 4.2-8-4.2v-8.4l8-4.2z" fill="none" stroke="#2B1D12" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M412 470.5l8 4 8-4M420 478.5v-8" fill="none" stroke="#2B1D12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="446" y="481" font-family="Fraunces, serif" font-weight="600" font-size="15" fill="#2B1D12">Service colis</text>
  </g>
</svg>
